apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data-pvc
  namespace: zylkerkart
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: gp2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-db
  namespace: zylkerkart
spec:
  selector:
    matchLabels:
      app: mysql-db
  strategy:
    type: Recreate  # Required for RWO volumes
  template:
    metadata:
      labels:
        app: mysql-db
    spec:
      nodeSelector:
        role: db-mysql
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "mysql"
          effect: "NoSchedule"
      containers:
      - name: mysql-db
        image: mysql:8
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: mypass
        - name: MYSQL_DATABASE
          value: ecommerce_app_database
        - name: MYSQL_USER
          value: mysqluser
        - name: MYSQL_PASSWORD
          value: mypass
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: mysql-init
          mountPath: /docker-entrypoint-initdb.d/user.sql
          subPath: user.sql
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-data-pvc
      - name: mysql-init
        configMap:
          name: mysql-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-db
  namespace: zylkerkart
spec:
  selector:
    app: mysql-db
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-script
  namespace: zylkerkart
data:
  user.sql: |
    GRANT ALL PRIVILEGES ON *.* TO 'mysqluser'@'%';
