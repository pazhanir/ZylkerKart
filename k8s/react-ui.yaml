apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-ui
  namespace: zylkerkart
spec:
  selector:
    matchLabels:
      app: react-ui
  template:
    metadata:
      labels:
        app: react-ui
    spec:
      nodeSelector:
        role: app
      containers:
      - name: react-ui
        image: impazhani/zylkerkart-react-ui:eks-v1
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: react-ui
  namespace: zylkerkart
spec:
  selector:
    app: react-ui
  type: ClusterIP # Changed to ClusterIP for Ingress
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
