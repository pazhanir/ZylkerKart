apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-suggestion-service
  namespace: zylkerkart
spec:
  selector:
    matchLabels:
      app: search-suggestion-service
  template:
    metadata:
      labels:
        app: search-suggestion-service
    spec:
      nodeSelector:
        role: app
      containers:
      - name: search-suggestion-service
        image: impazhani/zylkerkart-search-suggestion-service:latest
        imagePullPolicy: Always
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        env:
        - name: ACTIVE_PROFILE
          value: dev
        - name: PORT
          value: "10000"
        - name: COMMON_DATA_SERVICE_URL
          value: "http://common-data-service:9000"
        - name: JAVA_TOOL_OPTIONS
          value: "-javaagent:/home/apm/apminsight-javaagent.jar -Dapminsight.application.name=zylkerkart-search-suggestion-service"
        - name: S247_LICENSE_KEY
          value: "<YOUR_SITE24X7_LICENSE_KEY>"
        ports:
        - containerPort: 10000
        volumeMounts:
        - name: s247agent
          mountPath: /home/apm
      initContainers:
      - name: agent-copy-init
        image: site24x7/apminsight-javaagent:latest
        imagePullPolicy: IfNotPresent
        command: ['cp', '-r', '/opt/site24x7/.', '/home/apm']
        volumeMounts:
        - name: s247agent
          mountPath: /home/apm
      volumes:
      - name: s247agent
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: search-suggestion-service
  namespace: zylkerkart
spec:
  selector:
    app: search-suggestion-service
  ports:
    - protocol: TCP
      port: 10000
      targetPort: 10000
